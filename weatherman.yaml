        {"The *wind* blew the loose apple bloom and it fell in *showers* of painted *snow*.", "Richard Jefferies", "The Life of the Fields"},
        {"The *sun* was shining and a little *wind* was blowing—not a rough *wind*, but one which came in delightful little gusts and brought a fresh scent of newly turned earth with it.", "Frances Hodgson Burnett", "The Secret Garden"},
        {"I looked from the window, and the bright morning *star* was shining—the sky was full of the *wind* and the *star*.", "Richard Jefferies", "Field and Hedgerow"}
      };

      // Quote map - static to avoid recreation
      // Each entry carries its own length so lists can grow or shrink without reading past the end
      struct QuoteList {
        const Quote* quotes;
        size_t count;
      };
      #define QUOTE_LIST(arr) QuoteList{arr, sizeof(arr) / sizeof(arr[0])}
      static std::map<std::string, QuoteList> quote_map = {
        {"sunny", QUOTE_LIST(sunny_quotes)},
        {"clear", QUOTE_LIST(sunny_quotes)},
        {"clear-night", QUOTE_LIST(clear_night_quotes)},
        {"night", QUOTE_LIST(clear_night_quotes)},
        {"cloudy", QUOTE_LIST(cloudy_quotes)},
        {"partlycloudy", QUOTE_LIST(partlycloudy_quotes)},
        {"night-partly-cloudy", QUOTE_LIST(night_partlycloudy_quotes)},
        {"fog", QUOTE_LIST(fog_quotes)},
        {"hazy", QUOTE_LIST(fog_quotes)},
        {"rainy", QUOTE_LIST(rainy_quotes)},
        {"pouring", QUOTE_LIST(pouring_quotes)},
        {"snowy", QUOTE_LIST(snowy_quotes)},
        {"snowy-rainy", QUOTE_LIST(snowy_rainy_quotes)},
        {"hail", QUOTE_LIST(snowy_rainy_quotes)},
        {"lightning", QUOTE_LIST(lightning_quotes)},
        {"lightning-rainy", QUOTE_LIST(lightning_quotes)},
        {"windy", QUOTE_LIST(windy_quotes)},
        {"windy-variant", QUOTE_LIST(windy_quotes)}
      };
      static const QuoteList fallback_list = QUOTE_LIST(fallback_quotes);
      #undef QUOTE_LIST

      // Helper function to get a quote for a given condition
      auto get_quote_for_condition = [](std::string condition, int index) -> Quote {
        auto entry = quote_map.find(condition);
        const QuoteList& list = entry != quote_map.end() ? entry->second : fallback_list;
        return list.quotes[index % list.count];
      };

      // Text segment structure for mixed regular/bold rendering
      struct TextSegment {
        std::string text;
        bool is_bold;
      };

      // Parse text with *bold* markup into segments
      auto parse_bold_text = [](const std::string& text) -> std::vector<TextSegment> {
        std::vector<TextSegment> segments;
        std::string current = "";
        bool in_bold = false;

        for (size_t i = 0; i < text.length(); i++) {
          if (text[i] == '*') {
            if (!current.empty()) {
              segments.push_back({current, in_bold});
              current = "";
            }
            in_bold = !in_bold;
          } else {
            current += text[i];
          }
        }
        if (!current.empty()) {
          segments.push_back({current, in_bold});
        }
        return segments;
      };

      // Measure text width considering bold segments
      auto measure_segments_width = [](const std::vector<TextSegment>& segments,
                                       esphome::font::Font* regular_font,
                                       esphome::font::Font* bold_font) -> int {
        int total_width = 0;
        for (const auto& seg : segments) {
          int w, h, x, y;
          auto font = seg.is_bold ? bold_font : regular_font;
          font->measure(seg.text.c_str(), &w, &h, &x, &y);
          total_width += w;
        }
        return total_width;
      };

      // Measure actual line height considering bold segments
      auto measure_line_height = [](const std::vector<TextSegment>& segments,
                                     esphome::font::Font* regular_font,
                                     esphome::font::Font* bold_font) -> int {
        // Use the font's actual height, not the glyph bounding box
        // Check if any segments are bold to determine which font height to use
        bool has_bold = false;
        for (const auto& seg : segments) {
          if (seg.is_bold) {
            has_bold = true;
            break;
          }
        }
        // Return the taller of the two fonts if both are present
        int regular_height = regular_font->get_height();
        int bold_height = bold_font->get_height();
        return (has_bold && bold_height > regular_height) ? bold_height : regular_height;
      };

      // Text wrapping with bold support - returns lines with measured heights
      auto wrap_text_with_heights = [&parse_bold_text, &measure_segments_width, &measure_line_height]
                                     (std::string text, int max_width,
                                      esphome::font::Font* font, esphome::font::Font* bold_font)
                                     -> std::pair<std::vector<std::string>, std::vector<int>> {
        std::vector<std::string> lines;
        std::vector<int> line_heights;
        std::string current_line = "";
        std::string word = "";

        // Parse words manually (with space-handling fix)
        for (size_t i = 0; i <= text.length(); i++) {
          if (i == text.length() || text[i] == ' ') {
            if (!word.empty()) {
              std::string test_line = current_line.empty() ? word : current_line + " " + word;
              auto segments = parse_bold_text(test_line);
              int width = measure_segments_width(segments, font, bold_font);

              if (width <= max_width) {
                current_line = test_line;
              } else {
                if (!current_line.empty()) {
                  lines.push_back(current_line);
                  // Measure actual height of this line
                  auto line_segments = parse_bold_text(current_line);
                  int measured_h = measure_line_height(line_segments, font, bold_font);
                  ESP_LOGI("wrap", "Line %d height: %d - '%s'", lines.size(), measured_h, current_line.c_str());
                  line_heights.push_back(measured_h);
                  current_line = word;
                } else {
                  // Edge case: single word too long for line - add it anyway
                  lines.push_back(word);
                  auto line_segments = parse_bold_text(word);
                  int measured_h = measure_line_height(line_segments, font, bold_font);
                  ESP_LOGI("wrap", "Line %d height: %d (long word) - '%s'", lines.size(), measured_h, word.c_str());
                  line_heights.push_back(measured_h);
                  current_line = "";
                }
              }
              word = "";
            }
            // REMOVED: word += ' ' (space prepending bug fix)
            // Spaces are now handled via " " concatenation in test_line above
          } else {
            word += text[i];
          }
        }

        if (!current_line.empty()) {
          lines.push_back(current_line);
          auto line_segments = parse_bold_text(current_line);
          int measured_h = measure_line_height(line_segments, font, bold_font);
          ESP_LOGI("wrap", "Line %d height: %d (final) - '%s'", lines.size(), measured_h, current_line.c_str());
          line_heights.push_back(measured_h);
        }

        return {lines, line_heights};
      };

      // Helper to select font based on text length (adaptive sizing)
      auto get_font_for_quote = [](int text_length) -> esphome::font::Font* {
        if (text_length <= 60) return id(font_quote_74);      // Very short: 74pt
        if (text_length <= 120) return id(font_quote_66);     // Short: 66pt
        if (text_length <= 180) return id(font_quote_60);     // Medium: 60pt
        return id(font_quote_54);                              // Long: 54pt
      };

      // Map weather states to MDI characters
      std::map<std::string, std::string> weather_icon_map {
        {"clear", "\U000F0599"}, {"clear-night", "\U000F0594"}, {"cloudy", "\U000F0590"},
        {"fog", "\U000F0591"}, {"hail", "\U000F0592"}, {"lightning", "\U000F0593"},
        {"lightning-rainy", "\U000F067E"}, {"partlycloudy", "\U000F0595"}, {"pouring", "\U000F0596"},
        {"rainy", "\U000F0597"}, {"snowy", "\U000F0598"}, {"snowy-rainy", "\U000F067F"},
        {"sunny", "\U000F0599"}, {"windy", "\U000F059D"}, {"windy-variant", "\U000F059E"},
        {"cloudy-alert", "\U000F0F2F"}, {"cloudy-arrow-right", "\U000F0E6E"}, {"hazy", "\U000F0F30"},
        {"hurricane", "\U000F0898"}, {"night", "\U000F0594"}, {"night-partly-cloudy", "\U000F0F31"},
        {"partly-lightning", "\U000F0F32"}, {"partly-rainy", "\U000F0F33"}, {"partly-snowy", "\U000F0F34"},
        {"partly-snowy-rainy", "\U000F0F35"}, {"snowy-heavy", "\U000F0F36"}, {"sunny-alert", "\U000F0F37"},
        {"sunny-off", "\U000F14E4"}, {"sunset", "\U000F059A"}, {"sunset-down", "\U000F059B"},
        {"sunset-up", "\U000F059C"}, {"tornado", "\U000F0F38"}
      };

      // Show loading screen before data is received
      if (id(initial_data_received) == false) {
        it.printf(240, 400, id(font_attribution), color_text, TextAlign::TOP_CENTER, "Waiting for data...");
      } else {
        // Get current weather condition
        std::string current_condition = id(weather_now_condition).state.c_str();

        // Log the condition for debugging
        ESP_LOGI("display", "Current weather condition: '%s'", current_condition.c_str());

        // Get icon and determine if it's a fallback
        bool is_fallback = !weather_icon_map.count(current_condition);
        std::string current_icon = is_fallback ? "\U00002615" : weather_icon_map[current_condition];

        if (is_fallback) {
          ESP_LOGW("display", "Weather condition '%s' not found in map, using fallback", current_condition.c_str());
        }

        float current_temp = id(weather_now_temperature).state;

        // Get quote for current condition (hash-based selection for variety)
        int quote_index = id(recorded_display_refresh) + current_condition.length();
        Quote selected_quote = get_quote_for_condition(current_condition, quote_index);

        // Header: Icon + Temperature (center-aligned for proper vertical alignment)
        // Use appropriate font for icon (fallback uses PPMondwest, normal uses MDI)
        auto icon_font = is_fallback ? id(font_fallback_icon) : id(font_icon);
        it.printf(64, 120, icon_font, color_text, TextAlign::CENTER_LEFT, "%s", current_icon.c_str());
        it.printf(120, 120, id(font_temp), color_text, TextAlign::CENTER_LEFT, "%.0f°C", current_temp);

        // Low battery warning, top-right, so the frame asks to be charged before it goes blank
        if (id(battery_level).has_state() && id(battery_level).state < 15) {
          it.printf(416, 120, id(font_battery_icon), color_text, TextAlign::CENTER_RIGHT, "\U000F0083");
        }

        // Quote section (left-aligned, wrapped text, vertically centered)
        // Add typographic quotation marks around the quote (U+201C open, U+201D close)
        std::string quote_text = "\u201C" + std::string(selected_quote.text) + "\u201D";

        // Available height for quote block (with padding)
        int quote_block_padding_top = 16;  // Top padding
        int quote_block_padding_bottom = 32;  // Bottom padding (16px + 16px extra spacing)
        int max_quote_height = 666 - 180 - quote_block_padding_top - quote_block_padding_bottom;  // 438px available

        // Try fonts from largest to smallest until one fits
        esphome::font::Font* selected_font = id(font_quote_36);
        esphome::font::Font* selected_font_bold = id(font_quote_36_bold);
        int line_spacing = 0;  // Will be set by font selection loop
        std::vector<std::string> quote_lines;
        std::vector<int> measured_line_heights;

        // Font size options with dynamic line spacing
        struct FontOption {
          esphome::font::Font* regular;
          esphome::font::Font* bold;
          int font_size;
          int line_spacing;  // Extra spacing between lines
        };
        FontOption fonts[] = {
          {id(font_quote_74), id(font_quote_74_bold), 74, 6},   // 80px total (74 + 6)
          {id(font_quote_66), id(font_quote_66_bold), 66, 6},   // 72px total (66 + 6)
          {id(font_quote_60), id(font_quote_60_bold), 60, 5},   // 65px total (60 + 5)
          {id(font_quote_57), id(font_quote_57_bold), 57, 5},   // 62px total (57 + 5)
          {id(font_quote_54), id(font_quote_54_bold), 54, 4},   // 58px total (54 + 4)
          {id(font_quote_51), id(font_quote_51_bold), 51, 4},   // 55px total (51 + 4)
          {id(font_quote_48), id(font_quote_48_bold), 48, 4},   // 52px total (48 + 4)
          {id(font_quote_45), id(font_quote_45_bold), 45, 4},   // 49px total (45 + 4)
          {id(font_quote_42), id(font_quote_42_bold), 42, 4},   // 46px total (42 + 4)
          {id(font_quote_39), id(font_quote_39_bold), 39, 3},   // 42px total (39 + 3)
          {id(font_quote_36), id(font_quote_36_bold), 36, 3}    // 39px total (36 + 3)
        };

        // Try each font from largest to smallest
        for (const auto& font_opt : fonts) {
          auto result = wrap_text_with_heights(quote_text, 384, font_opt.regular, font_opt.bold);
          auto test_lines = result.first;
          auto test_heights = result.second;

          // Calculate total height using measured line heights + spacing
          int test_height = 0;
          for (size_t i = 0; i < test_heights.size(); i++) {
            test_height += test_heights[i];
            if (i < test_heights.size() - 1) {
              test_height += font_opt.line_spacing;  // Add spacing between lines
            }
          }

          ESP_LOGI("font_select", "Font %dpt: %d lines, total height %d", font_opt.font_size, test_lines.size(), test_height);

          if (test_height <= max_quote_height) {
            selected_font = font_opt.regular;
            selected_font_bold = font_opt.bold;
            quote_lines = test_lines;
            measured_line_heights = test_heights;
            line_spacing = font_opt.line_spacing;
            break;
          }
        }

        // If no font fit (shouldn't happen), use smallest
        if (quote_lines.empty()) {
          auto [fallback_lines, fallback_heights] = wrap_text_with_heights(quote_text, 384, selected_font, selected_font_bold);
          quote_lines = fallback_lines;
          measured_line_heights = fallback_heights;
          line_spacing = 4;
        }

        // Calculate vertical centering with measured line heights
        int quote_total_height = 0;
        for (size_t i = 0; i < measured_line_heights.size(); i++) {
          quote_total_height += measured_line_heights[i];
          if (i < measured_line_heights.size() - 1) {
            quote_total_height += line_spacing;
          }
        }

        int available_space = max_quote_height;
        int quote_start_y = 180 + quote_block_padding_top + (available_space - quote_total_height) / 2;

        // Render quote lines with mixed regular/bold fonts (left-aligned)
        int y_pos = quote_start_y;
        for (size_t line_idx = 0; line_idx < quote_lines.size(); line_idx++) {
          const auto& line = quote_lines[line_idx];
          int current_line_height = measured_line_heights[line_idx];

          // Parse line into segments
          auto segments = parse_bold_text(line);

          // Render each segment with appropriate font
          int x_pos = 64;
          for (const auto& seg : segments) {
            auto font = seg.is_bold ? selected_font_bold : selected_font;
            it.print(x_pos, y_pos, font, color_text, TextAlign::TOP_LEFT, seg.text.c_str());

            // Advance x position by segment width
            int w, h, x, y;
            font->measure(seg.text.c_str(), &w, &h, &x, &y);
            x_pos += w;
          }

          // Advance y position by measured line height + spacing
          y_pos += current_line_height + line_spacing;
        }

        // Attribution (left-aligned, pinned to bottom with 64px padding)
        it.printf(64, 666, id(font_attribution), color_text, TextAlign::TOP_LEFT, "%s", selected_quote.author);
        it.printf(64, 698, id(font_attribution), color_text, TextAlign::TOP_LEFT, "%s", selected_quote.source);
      }
