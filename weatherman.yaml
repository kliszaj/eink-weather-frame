color:
  - id: color_bg
    red: 0%
    green: 0%
    blue: 0%
    white: 0%
  - id: color_text
    red: 0%
    green: 0%
    blue: 0%
    white: 100%

# Pins for Seeed XIAO ePaper Display Board EE04 (jumper set to 24-pin)
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Now render everything on the ePaper screen.
display:
