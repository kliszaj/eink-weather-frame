# Call Weather sensors from HA.
sensor:
  - platform: template
    name: "Weatherframe - Display Last Update"
    device_class: timestamp
    entity_category: "diagnostic"
    id: display_last_update

  - platform: homeassistant
    entity_id: sensor.openweathermap_feels_like_temperature
    id: weather_now_temperature

  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    id: wifisignal
    update_interval: never  # Only update on wake, not continuously

  # EE04 battery voltage: GPIO1 behind a divider that GPIO6 switches on (read once per wake in on_boot).
  # If the reading disagrees with a multimeter on the battery, adjust the multiply factor.
  - platform: adc
    pin: GPIO1
    name: "Weatherframe Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    entity_category: "diagnostic"
    filters:
      - multiply: 2.0  # Voltage divider compensation

  - platform: template
    name: "Weatherframe Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: 'return id(battery_voltage).state;'
    filters:
      # LiPo discharge curve (from Seeed's reTerminal E10xx ESPHome cookbook)
      # method: exact interpolates between points; the default fits one straight line through all of them
      - calibrate_linear:
          method: exact
          datapoints:
          - 3.27 -> 0.0
          - 3.30 -> 5.0
          - 3.41 -> 10.0
          - 3.49 -> 20.0
          - 3.58 -> 30.0
          - 3.68 -> 40.0
          - 3.75 -> 50.0
          - 3.80 -> 60.0
          - 3.85 -> 70.0
          - 3.91 -> 80.0
          - 3.96 -> 90.0
          - 4.15 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

output:
  - platform: gpio
    pin: GPIO6
    id: battery_adc_enable



text_sensor:
  - platform: homeassistant
    entity_id: sensor.openweathermap_condition
    id: weather_now_condition

# Manual control buttons
button:
  - platform: template
    name: "Weatherframe Manual Refresh"
    icon: "mdi:refresh"
    on_press:
      - logger.log: "Manual refresh requested"
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: 'id(prevent_sleep) = true;'
            - script.execute: update_screen
          else:
            - logger.log: "Device not connected (likely sleeping)"

  - platform: restart
    name: "Weatherframe Restart"

# Define colors
