# eINK DASHBOARD

esphome:
  name: "weatherframe"
  on_boot:
    priority: 200.0
    then:
      # Wait for WiFi connection
      - logger.log: "Boot: Waiting for WiFi..."
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s

      # Handle WiFi failure
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log: "ERROR: WiFi failed, sleeping 10min"
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: 10min

      # Wait for Home Assistant connection
      - logger.log: "Boot: Waiting for Home Assistant..."
      - wait_until:
          condition:
            api.connected:
          timeout: 20s

      # Wait for time from Home Assistant (sent right after the API connects; bounded so an
      # outage can't keep us awake; update_and_sleep retries in 30min if time is still invalid)
      - logger.log: "Boot: Waiting for time sync..."
      - wait_until:
          condition:
            time.has_time:
          timeout: 5s

      # Wait until both weather sensors have arrived from Home Assistant (usually well under a second)
      - wait_until:
          condition:
            lambda: 'return !isnan(id(weather_now_temperature).state) && id(weather_now_condition).has_state();'
          timeout: 5s

      # Only redraw when we actually have weather data; otherwise the e-ink keeps showing the last good screen
      - lambda: |-
          id(initial_data_received) = !isnan(id(weather_now_temperature).state) && id(weather_now_condition).has_state();

      # Read the battery once per wake (divider is only powered while measuring)
      - output.turn_on: battery_adc_enable
      - delay: 10ms
      - component.update: battery_voltage
      - output.turn_off: battery_adc_enable
      - component.update: battery_level

      # Update display and enter deep sleep
      - logger.log: "Boot: Updating display and entering sleep"
      - script.execute: update_and_sleep

# Seeed XIAO ePaper Display Board EE04 (XIAO ESP32-S3 Plus)
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome

# Global variables for tracking display state
globals:
  - id: initial_data_received
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: recorded_display_refresh
    type: int
    restore_value: yes
    initial_value: '0'
  - id: prevent_sleep
    type: bool
    restore_value: no
    initial_value: 'false'

# Deep sleep configuration for battery optimization
deep_sleep:
  id: deep_sleep_control
  # Sleep duration set dynamically in update_and_sleep script
  # KEY1 (GPIO2, active-low) wakes the frame early for a fresh quote
  esp32_ext1_wakeup:
    pins:
      - number: GPIO2
        mode: INPUT_PULLUP
    mode: ANY_LOW

# Script for updating screen - Refresh display and publish refresh count and time. (Thanks @paviro!)
script:
  # Manual refresh (no sleep) - for testing and manual updates
  - id: update_screen
    then:
      - component.update: eink_display
      - lambda: 'id(recorded_display_refresh) += 1;'
      - lambda: 'id(display_last_update).publish_state(id(ha_time).now().timestamp);'
      - logger.log: "Display refresh complete (manual, no sleep)"

  # Automatic refresh with deep sleep - main power-saving script
  - id: update_and_sleep
    then:
      - logger.log: "Starting display update sequence"

      - if:
          condition:
            lambda: 'return id(initial_data_received);'
          then:
            # Update display
            - component.update: eink_display

            # Update counters and timestamp
            - lambda: 'id(recorded_display_refresh) += 1;'
            - lambda: 'id(display_last_update).publish_state(id(ha_time).now().timestamp);'

            - logger.log:
                format: "Display refresh #%d complete"
                args: ['id(recorded_display_refresh)']
          else:
            - logger.log: "No weather data from Home Assistant, keeping previous screen"

      # Check if sleep should be prevented (for manual refresh)
      - if:
          condition:
            lambda: 'return id(prevent_sleep);'
          then:
            - logger.log: "Sleep prevented by manual flag"
            - lambda: 'id(prevent_sleep) = false;'
          else:
            # Calculate sleep duration dynamically
            - lambda: |-
                auto time_now = id(ha_time).now();
                if (!time_now.is_valid()) {
                  ESP_LOGE("sleep", "Time not valid, sleeping 30min and retrying");
                  id(deep_sleep_control).set_sleep_duration(30 * 60 * 1000);
                  id(deep_sleep_control).begin_sleep();
                  return;
                }

                int current_hour = time_now.hour;
                int current_minute = time_now.minute;
                int sleep_minutes = 0;

                // Calculate minutes until next scheduled refresh
                // Schedule: 6:00, 10:00, 14:00, 18:00, 22:00
                if (current_hour >= 0 && current_hour < 6) {
                  sleep_minutes = (6 - current_hour) * 60 - current_minute;
                } else if (current_hour >= 6 && current_hour < 10) {
                  sleep_minutes = (10 - current_hour) * 60 - current_minute;
                } else if (current_hour >= 10 && current_hour < 14) {
                  sleep_minutes = (14 - current_hour) * 60 - current_minute;
                } else if (current_hour >= 14 && current_hour < 18) {
                  sleep_minutes = (18 - current_hour) * 60 - current_minute;
                } else if (current_hour >= 18 && current_hour < 22) {
                  sleep_minutes = (22 - current_hour) * 60 - current_minute;
                } else {  // 22:00-23:59
                  sleep_minutes = (24 - current_hour + 6) * 60 - current_minute;
                }

                // Wake 3 minutes early for connection time
                sleep_minutes -= 3;

                // Safety bounds: 5 min minimum, 540 min (9 hours) maximum
                if (sleep_minutes < 5) {
                  sleep_minutes = 5;
                } else if (sleep_minutes > 540) {
                  sleep_minutes = 540;
                }

                // Convert to milliseconds
                uint64_t sleep_duration_ms = (uint64_t)sleep_minutes * 60 * 1000;

                ESP_LOGI("sleep", "Sleeping for %d minutes (until next refresh)", sleep_minutes);

                // Set sleep duration
                id(deep_sleep_control).set_sleep_duration(sleep_duration_ms);

            # Delay to ensure logs are transmitted
            - delay: 500ms

            # Enter deep sleep
            - deep_sleep.enter: deep_sleep_control

# Wifi information
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Optimize for fast connection on wake from deep sleep
  fast_connect: true  # Skip network scanning
  power_save_mode: none  # Max performance during brief active time


# Time from Home Assistant for autonomous wake scheduling (much faster than NTP on wake,
# since the API connection is already up)
time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Stockholm
    on_time_sync:
      then:
        - logger.log:
            format: "Time synchronized: %s"
            args: ['id(ha_time).now().strftime("%Y-%m-%d %H:%M:%S").c_str()']

